services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - ./.env
    ports:
      - "5000:5000"
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL must be set in .env}
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped
